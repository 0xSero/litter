name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build. Defaults to the dispatched commit."
        required: false
        default: ""
        type: string
      publish_to_play:
        description: "Publish the signed bundle to Google Play. Disable to produce artifacts for a manual upload."
        required: false
        default: true
        type: boolean
      track:
        description: "Upload track (destination if promote_track is blank)."
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      promote_track:
        description: "If set, promote the uploaded build from `track` to this track."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - alpha
          - beta
          - production
      release_status:
        description: "Release status for the final track."
        required: false
        default: "draft"
        type: choice
        options:
          - completed
          - inProgress
          - draft
          - halted
      user_fraction:
        description: "Staged rollout (0.0–1.0). Only used when release_status=inProgress."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Google Play release access
        if: inputs.publish_to_play
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          LITTER_UPLOAD_STORE_PASSWORD: ${{ secrets.LITTER_UPLOAD_STORE_PASSWORD }}
          LITTER_UPLOAD_KEY_ALIAS: ${{ secrets.LITTER_UPLOAD_KEY_ALIAS }}
          LITTER_UPLOAD_KEY_PASSWORD: ${{ secrets.LITTER_UPLOAD_KEY_PASSWORD }}
          LITTER_PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.LITTER_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: ./tools/scripts/check-google-play-release.sh

  shared-prep:
    needs: release-preflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      SCCACHE_BUCKET: rust-cache
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: ci/android-release
      SCCACHE_LOG: info
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Setup Zig (libghostty build)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure sccache
        run: |
          if [ -n "${SCCACHE_ENDPOINT:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
            echo "SCCACHE_ENDPOINT=" >> "$GITHUB_ENV"
            echo "SCCACHE_S3_KEY_PREFIX=" >> "$GITHUB_ENV"
            echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
            echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          fi

      - name: Setup sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Sync codex submodule
        run: ./apps/ios/scripts/sync-codex.sh --preserve-current

      - name: Restore generated mobile bindings cache
        id: mobile-bindings-cache
        uses: actions/cache@v4
        with:
          path: |
            shared/rust-bridge/generated
          key: mobile-bindings-${{ runner.os }}-${{ hashFiles('apps/ios/scripts/sync-codex.sh', 'shared/rust-bridge/generate-bindings.sh', 'shared/rust-bridge/Cargo.toml', 'shared/rust-bridge/Cargo.lock', 'shared/rust-bridge/codex-mobile-client/src/**', 'shared/rust-bridge/uniffi-bindgen/**', 'patches/codex/**', 'shared/third_party/codex/codex-rs/app-server-protocol/src/protocol/**', 'shared/third_party/codex/codex-rs/protocol/src/**') }}

      - name: Generate shared mobile bindings
        if: steps.mobile-bindings-cache.outputs.cache-hit != 'true'
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cd shared/rust-bridge
          ./generate-bindings.sh --kotlin-only

      - name: Package shared prep artifact
        run: |
          mkdir -p .ci-prep/shared
          tar -czf .ci-prep/shared/generated-mobile-sources.tgz -C . \
            shared/rust-bridge/generated \

      - name: Upload shared prep artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-prep
          path: .ci-prep/shared
          if-no-files-found: error

  play-release:
    needs: shared-prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      SCCACHE_BUCKET: rust-cache
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: ci/android-release
      SCCACHE_LOG: info
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libcap-dev clang cmake

      - name: Setup Zig (libghostty build)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Configure sccache
        run: |
          if [ -n "${SCCACHE_ENDPOINT:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
            echo "SCCACHE_ENDPOINT=" >> "$GITHUB_ENV"
            echo "SCCACHE_S3_KEY_PREFIX=" >> "$GITHUB_ENV"
            echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
            echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          fi

      - name: Setup sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prime sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          export SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-android.log"
          rm -f "$SCCACHE_ERROR_LOG"
          sccache --stop-server || true
          sccache --start-server
          sccache --show-stats || true

      - name: Download shared prep artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-prep
          path: .ci-prep/shared

      - name: Restore shared prep
        run: |
          ./apps/ios/scripts/sync-codex.sh --preserve-current

          SHARED_PREP_ROOT=.ci-prep/shared
          if [ -d "$SHARED_PREP_ROOT/shared" ]; then
            SHARED_PREP_ROOT="$SHARED_PREP_ROOT/shared"
          fi

          tar -xzf "$SHARED_PREP_ROOT/generated-mobile-sources.tgz" -C .
          mkdir -p .build-stamps
          touch .build-stamps/sync .build-stamps/bindings-kotlin

      - name: Install cargo-ndk
        run: env -u RUSTC_WRAPPER cargo install cargo-ndk --locked

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release credentials
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          LITTER_PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.LITTER_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          store_file="$RUNNER_TEMP/litter-upload.jks"
          service_account_json="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$store_file"
          if printf '%s' "$LITTER_PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 --decode 2>/dev/null > "$service_account_json" \
            && jq -e . "$service_account_json" >/dev/null 2>&1; then
            :
          else
            printf '%s' "$LITTER_PLAY_SERVICE_ACCOUNT_JSON_B64" > "$service_account_json"
            jq -e . "$service_account_json" >/dev/null
          fi
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > apps/android/app/google-services.json
          fi
          echo "LITTER_UPLOAD_STORE_FILE=$store_file" >> "$GITHUB_ENV"
          echo "LITTER_PLAY_SERVICE_ACCOUNT_JSON=$service_account_json" >> "$GITHUB_ENV"
          ls -lh "$store_file" "$service_account_json" apps/android/app/google-services.json 2>/dev/null || ls -lh "$store_file" "$service_account_json"

      - name: Resolve Android release inputs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          CURRENT_VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' apps/android/app/build.gradle.kts | head -1)"
          if [[ -z "$CURRENT_VERSION_CODE" ]]; then
            echo "Unable to resolve the current Android versionCode" >&2
            exit 1
          fi
          RUN_VERSION_CODE="$((200000000 + GITHUB_RUN_NUMBER))"
          VERSION_CODE="$RUN_VERSION_CODE"
          if (( VERSION_CODE <= CURRENT_VERSION_CODE )); then
            VERSION_CODE="$((CURRENT_VERSION_CODE + 1))"
          fi
          echo "Android versionCode: current=$CURRENT_VERSION_CODE run=$RUN_VERSION_CODE selected=$VERSION_CODE"
          echo "LITTER_VERSION_CODE_OVERRIDE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Apply Android versionCode
        env:
          LITTER_VERSION_CODE_OVERRIDE: ${{ env.LITTER_VERSION_CODE_OVERRIDE }}
        run: ./apps/android/scripts/bump-version.sh

      - name: Build Rust Android release libs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "1"
          ANDROID_ABIS: arm64-v8a
          ANDROID_RUST_PROFILE: mobile-release
        run: |
          set -euo pipefail
          export SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-android.log"
          trap 'status=$?; echo "==> sccache stats"; sccache --show-stats || true; if [ -f "$SCCACHE_ERROR_LOG" ]; then echo "==> sccache error log"; tail -200 "$SCCACHE_ERROR_LOG" || true; fi; exit $status' EXIT
          sccache --zero-stats || true
          make rust-android
          echo "==> sccache stats after Android Rust build"
          sccache --show-stats || true

      - name: Build Android release APK
        id: build_android_release
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
          GRADLE_MAX_WORKERS: "1"
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          LITTER_UPLOAD_STORE_FILE: ${{ env.LITTER_UPLOAD_STORE_FILE }}
          LITTER_UPLOAD_STORE_PASSWORD: ${{ secrets.LITTER_UPLOAD_STORE_PASSWORD }}
          LITTER_UPLOAD_KEY_ALIAS: ${{ secrets.LITTER_UPLOAD_KEY_ALIAS }}
          LITTER_UPLOAD_KEY_PASSWORD: ${{ secrets.LITTER_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          heartbeat() {
            while sleep 60; do
              echo "==> heartbeat $(date -u +%FT%TZ)"
              free -h || true
              df -h . || true
            done
          }
          heartbeat &
          HEARTBEAT_PID=$!
          trap 'status=$?; kill "$HEARTBEAT_PID" >/dev/null 2>&1 || true; wait "$HEARTBEAT_PID" 2>/dev/null || true; exit $status' EXIT
          ./apps/android/gradlew -p apps/android --no-daemon --stacktrace "--max-workers=$GRADLE_MAX_WORKERS" \
            :app:assembleRelease \
            -PLITTER_UPLOAD_STORE_FILE="$LITTER_UPLOAD_STORE_FILE" \
            -PLITTER_UPLOAD_STORE_PASSWORD="$LITTER_UPLOAD_STORE_PASSWORD" \
            -PLITTER_UPLOAD_KEY_ALIAS="$LITTER_UPLOAD_KEY_ALIAS" \
            -PLITTER_UPLOAD_KEY_PASSWORD="$LITTER_UPLOAD_KEY_PASSWORD"

      - name: Publish and promote Android bundle to Google Play
        if: inputs.publish_to_play
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
          GRADLE_MAX_WORKERS: "1"
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          LITTER_VERSION_CODE_OVERRIDE: ${{ env.LITTER_VERSION_CODE_OVERRIDE }}
          LITTER_UPLOAD_STORE_FILE: ${{ env.LITTER_UPLOAD_STORE_FILE }}
          LITTER_UPLOAD_STORE_PASSWORD: ${{ secrets.LITTER_UPLOAD_STORE_PASSWORD }}
          LITTER_UPLOAD_KEY_ALIAS: ${{ secrets.LITTER_UPLOAD_KEY_ALIAS }}
          LITTER_UPLOAD_KEY_PASSWORD: ${{ secrets.LITTER_UPLOAD_KEY_PASSWORD }}
          LITTER_PLAY_SERVICE_ACCOUNT_JSON: ${{ env.LITTER_PLAY_SERVICE_ACCOUNT_JSON }}
          LITTER_PLAY_TRACK: ${{ inputs.track }}
          LITTER_PLAY_PROMOTE_TRACK: ${{ inputs.promote_track }}
          LITTER_PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
          LITTER_PLAY_USER_FRACTION: ${{ inputs.user_fraction }}
        run: |
          set -euo pipefail
          heartbeat() {
            while sleep 60; do
              echo "==> heartbeat $(date -u +%FT%TZ)"
              free -h || true
              df -h . || true
            done
          }
          heartbeat &
          HEARTBEAT_PID=$!
          trap 'status=$?; kill "$HEARTBEAT_PID" >/dev/null 2>&1 || true; wait "$HEARTBEAT_PID" 2>/dev/null || true; exit $status' EXIT
          ./apps/android/scripts/play-upload.sh
          sccache --show-stats || true

      - name: Generate checksums
        if: always() && steps.build_android_release.outcome == 'success'
        run: |
          set -euo pipefail
          APK_PATH="apps/android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="apps/android/app/build/outputs/bundle/release/app-release.aab"
          sha256sum "$APK_PATH" > "${APK_PATH}.sha256"
          sha256sum "$AAB_PATH" > "${AAB_PATH}.sha256"

      - name: Upload Android release artifacts
        if: always() && steps.build_android_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-play-release-${{ github.run_number }}
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/app-release.apk.sha256
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
