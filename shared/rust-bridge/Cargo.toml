[workspace]
members = [
    "codex-slingshot",
    "codex-mobile-client",
    "uniffi-bindgen",
]
resolver = "3"

[workspace.dependencies]
codex-app-server = { path = "../third_party/codex/codex-rs/app-server" }
codex-app-server-client = { path = "../third_party/codex/codex-rs/app-server-client" }
codex-app-server-protocol = { path = "../third_party/codex/codex-rs/app-server-protocol" }
codex-protocol = { path = "../third_party/codex/codex-rs/protocol" }
codex-core = { path = "../third_party/codex/codex-rs/core" }
codex-exec-server = { path = "../third_party/codex/codex-rs/exec-server" }
codex-login = { path = "../third_party/codex/codex-rs/login" }
codex-shell-command = { path = "../third_party/codex/codex-rs/shell-command" }
codex-apply-patch = { path = "../third_party/codex/codex-rs/apply-patch" }
codex-arg0 = { path = "../third_party/codex/codex-rs/arg0" }
codex-feedback = { path = "../third_party/codex/codex-rs/feedback" }
codex-cloud-config = { path = "../third_party/codex/codex-rs/cloud-config" }
codex-config = { path = "../third_party/codex/codex-rs/config" }
codex-utils-absolute-path = { path = "../third_party/codex/codex-rs/utils/absolute-path" }
codex-git-utils = { path = "../third_party/codex/codex-rs/git-utils" }
# Pinned to the same immutable commit as the kittylitter daemon so the phone
# and host share one immutable Alleycat release revision. All crates come from
# the same source so the `Bridge` trait identity is consistent; forked until
# the production-lineage OpenCode and Amp fixes land in the upstream release.
alleycat-bridge-core = { git = "https://github.com/0xSero/alleycat.git", rev = "85c3d1ed9689e26364e0cb835d22958e2feec894" }
alleycat-pi-bridge = { git = "https://github.com/0xSero/alleycat.git", rev = "85c3d1ed9689e26364e0cb835d22958e2feec894" }
alleycat-claude-bridge = { git = "https://github.com/0xSero/alleycat.git", rev = "85c3d1ed9689e26364e0cb835d22958e2feec894" }
alleycat-opencode-bridge = { git = "https://github.com/0xSero/alleycat.git", rev = "85c3d1ed9689e26364e0cb835d22958e2feec894" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
lru = "0.12"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
russh = "0.62.6"
futures = "0.3"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
shlex = "1"

[profile.release]
strip = true
lto = "fat"
opt-level = "z"
codegen-units = 1
panic = "abort"

# Used by the iOS fast lanes (`--fast-device`, `--fast-sim`).
# `debug = 1` emits line tables only — crashes still resolve to file:line,
# but the massive per-variable DWARF (which pushes the default `dev`
# staticlib to ~2.7GB) is gone. Expect ~10× smaller libcodex_mobile_client.a
# and a correspondingly faster Swift link step.
[profile.ios-dev]
inherits = "dev"
# opt-level 2 instead of the dev default (0): the staticlib is still small
# (debug = 1 keeps line tables only) but the interpreter-side hot loops —
# streaming snapshot assembly, conversation projection, JSON parsing — run
# roughly an order of magnitude faster, which is what the mobile UI feels.
opt-level = 2
debug = 1
codegen-units = 256

[profile.mobile-release]
inherits = "release"
lto = false
strip = true
debug = 0
codegen-units = 16

[profile.android-dev]
inherits = "release"
lto = false
strip = true
debug = 0
codegen-units = 16

[patch.crates-io]
# Upstream fix for Starlark's exact blake3 pin, which conflicts with iroh.
starlark = { git = "https://github.com/facebook/starlark-rust", rev = "3bed1c40f93da22b8e251dd520dfb8d35bfe1fb7" }

tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
